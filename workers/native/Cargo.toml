[package]
name = "harness-desktop"
version = "0.1.0"
edition = "2021"

# The native helper is built separately for each desktop OS.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
libc = "0.2"
x11rb = { version = "0.13", features = ["xtest", "randr"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Graphics_Capture", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }
windows-capture = "=2.0.1"

[package]
name = "harness-executor"
version.workspace = true
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
globset = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

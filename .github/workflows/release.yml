name: Build prerelease installers

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            bundles: app
          - target: macos-x64
            os: macos-15-intel
            bundles: app
          - target: windows-x64
            os: windows-2022
            bundles: nsis,msi
          - target: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libdbus-1-dev libpipewire-0.3-dev libxtst-dev libfuse2t64
      - run: npm ci
      - run: npm run setup:workers
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: npm run desktop:build -- --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Collect platform installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-assets.mjs collect '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Wait for verification of the release commit
        timeout-minutes: 32
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml --branch main --commit "$GITHUB_SHA" --event push --limit 10 --json status,conclusion --jq '.[0] | if . == null then "missing" elif .status == "completed" then .conclusion else .status end')
            case "$status" in
              success) exit 0 ;;
              failure|cancelled|timed_out|startup_failure|action_required|stale) echo "Verification did not pass: $status"; exit 1 ;;
              *) echo "Verification is $status; waiting ($attempt/90)"; sleep 20 ;;
            esac
          done
          echo 'Timed out waiting for verification.'
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Verify installer set and checksums
        run: node scripts/release-assets.mjs verify-local
      - name: Verify updater signatures and signed versions
        run: cargo run --locked -p harness-update-verify -- release-assets
      - name: Upload and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/release-state; then
            state=$(cat /tmp/release-state)
          else
            gh release create "$TAG" --verify-tag --draft --prerelease --title "Gemma Harness $TAG" --notes-file docs/release-notes.md
            state=true
          fi
          if [ "$state" = true ]; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release view "$TAG" --json isDraft,isPrerelease,assets > release-remote.json
            node scripts/release-assets.mjs verify-remote
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release view "$TAG" --json isDraft,isPrerelease,assets > release-remote.json
            HARNESS_ALLOW_PUBLISHED_RELEASE=1 node scripts/release-assets.mjs verify-remote
          fi
      - name: Publish update channel after release verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-update-channel.mjs

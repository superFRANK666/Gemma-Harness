name: Verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libdbus-1-dev libpipewire-0.3-dev libxtst-dev
      - run: npm ci
      - run: npm --prefix workers/browser ci
      - run: node workers/build-native.mjs
      - run: node scripts/setup-workers.mjs
      - run: npm run build
      - run: npm run test:release
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --exclude harness-desktop
      - run: cargo check -p harness-desktop
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm --prefix workers/browser run install-browser -- --with-deps
      - run: npm --prefix workers/browser test
        env:
          HARNESS_BROWSER_INTEGRATION: '1'
          HARNESS_BROWSER_HEADLESS: '1'
      - run: cargo fmt --manifest-path workers/native/Cargo.toml -- --check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-${{ runner.os }}
          path: tests/ui/artifacts/
          if-no-files-found: warn
